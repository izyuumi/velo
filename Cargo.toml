[package]
name = "video_hosted"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
