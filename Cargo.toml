[package]
name = "video_hosted"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json", "tls"] }
rocket_dyn_templates = { version = "0.1.0", features = ["tera"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
